<!DOCTYPE html>
<html lang="en">
<head>
  <title>Rhea Anne Danao - Personal Profile</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css?version=0.58">
  <link rel="stylesheet" href="css/image.css?version=0.2">
  <style>
    html {
      scroll-behavior: smooth;
    }
    .card img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }
    .comments {
      margin-top: 20px;
    }
    .comments textarea {
      width: 100%;
      margin-bottom: 10px;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      padding: 10px;
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>Personal Profile Webpage</h1>
      <p class="subtext">Welcome, I'm Rhea!</p>
    </div>

    <!-- Card Navigation -->
    <div class="card-container">
      <div class="card" v-for="link in navLinks" :key="link.text">
        <img :src="link.image" :alt="link.text">
        <a :href="link.target"><p>{{ link.text }}</p></a>
      </div>
    </div>

    <!-- Sections -->
    <div id="about" class="container">
      <h2>About Me</h2>
      <p>{{ aboutText }}</p>
      <div class="comments">
        <h3>Comments</h3>
        <textarea v-model="newComment" placeholder="Add a comment..."></textarea>
        <button @click="addComment('about')">Submit</button>
        <ul>
          <li v-for="comment in comments.about" :key="comment">{{ comment }}</li>
        </ul>
      </div>
    </div>

    <div id="education" class="container">
      <h2>Education & Achievements</h2>
      <ul>
        <li v-for="achievement in education" :key="achievement">{{ achievement }}</li>
      </ul>
      <div class="comments">
        <h3>Comments</h3>
        <textarea v-model="newComment" placeholder="Add a comment..."></textarea>
        <button @click="addComment('education')">Submit</button>
        <ul>
          <li v-for="comment in comments.education" :key="comment">{{ comment }}</li>
        </ul>
      </div>
    </div>

    <!-- Picture Gallery -->
    <div id="Gallery" class="container">
      <h2>Picture Gallery</h2>
      <div class="row">
        <div class="col-md-4" v-for="image in gallery" :key="image.name">
          <figure>
            <img :src="image.url" :alt="image.name" class="img-fluid">
            <figcaption>{{ image.name }}</figcaption>
          </figure>
        </div>
      </div>
    </div>

    <!-- Contact Form -->
    <div id="contact" class="container">
      <h2>Contact Me</h2>
      <form @submit.prevent="submitContact">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" v-model="contact.name" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" v-model="contact.email" required>
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="3" v-model="contact.message" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2024 Rhea Anne Danao</p>
    </footer>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    Vue.createApp({
      data() {
        return {
          aboutText: "Hello, I'm Rhea. You can call me 'Eyya.' I'm a province girl from Isabela.",
          navLinks: [
            { text: 'ABOUT ME', image: 'https://i.ibb.co/wgYmVKb/image1.jpg', target: '#about' },
            { text: 'EDUCATION & ACHIEVEMENTS', image: 'https://i.ibb.co/8j5PQKX/image2.jpg', target: '#education' },
            { text: 'PICTURE GALLERY', image: 'https://i.ibb.co/TvdjQwF/image6.jpg', target: '#Gallery' },
            { text: 'CONTACT ME', image: 'https://i.ibb.co/D4Gw2vg/icon3.jpg', target: '#contact' },
          ],
          education: [
            "Binguang Elementary School (2016-2017)",
            "San Pablo National High School - With Honors",
            "Asia Pacific College - Executive Director of Membership Committee",
          ],
          gallery: [
            { name: 'Family', url: 'https://i.ibb.co/wgYmVKb/image1.jpg' },
            { name: 'Myself', url: 'https://i.ibb.co/8j5PQKX/image2.jpg' },
          ],
          comments: {
            about: [],
            education: [],
          },
          newComment: '',
          contact: {
            name: '',
            email: '',
            message: '',
          },
        };
      },
      methods: {
        addComment(section) {
          if (this.newComment.trim()) {
            this.comments[section].push(this.newComment.trim());
            this.newComment = '';
          } else {
            alert('Comment cannot be empty!');
          }
        },
        submitContact() {
          alert(`Thank you, ${this.contact.name}, for your message!`);
          this.contact.name = '';
          this.contact.email = '';
          this.contact.message = '';
        },
      },
    }).mount('#app');
  </script>
</body>
</html>
